name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: virustotal-public-api
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci clears node_modules, so restore native tools after installation.
      - name: Cache native linters
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/lint-tools
          key: ${{ runner.os }}-${{ runner.arch }}-lint-tools-${{ hashFiles('scripts/lint-tools.mjs') }}
      - run: npm run lint
      - run: npm test
      - name: Read Playwright version
        id: playwright-version
        run: node -e 'console.log("version=" + require("playwright/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Cache Chromium headless shell
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-playwright-shell-${{ steps.playwright-version.outputs.version }}
      # Linux libraries are runner-specific and cannot be restored with the browser.
      - name: Install Chromium headless shell and system dependencies
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:integration
      - run: npm run build
      - name: Scan release files with VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: npm run scan:virustotal
      - name: Preserve VirusTotal report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-report
          path: artifacts/virustotal/
          if-no-files-found: warn
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const m=require("./manifest.json"); if(process.env.RELEASE_TAG!==m.version) { console.error("Tag " + process.env.RELEASE_TAG + " does not match manifest version " + m.version); process.exit(1); }'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == 0.* ]]; then
            gh release create "$RELEASE_TAG" main.js manifest.json styles.css artifacts/virustotal/virustotal-report.json artifacts/virustotal/virustotal-report.md --generate-notes --title "Mermaid Flow Enhancer $RELEASE_TAG — desktop beta"
          else
            gh release create "$RELEASE_TAG" main.js manifest.json styles.css artifacts/virustotal/virustotal-report.json artifacts/virustotal/virustotal-report.md --generate-notes
          fi
