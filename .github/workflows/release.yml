name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run build
      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const m=require("./manifest.json"); if(process.env.RELEASE_TAG!==m.version) { console.error(`Tag ${process.env.RELEASE_TAG} does not match manifest version ${m.version}`); process.exit(1); }'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == 0.* ]]; then
            gh release create "$RELEASE_TAG" main.js manifest.json styles.css --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" main.js manifest.json styles.css --generate-notes
          fi
